<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon XO - Zaid Jo</title>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap');
        
        :root { 
            --bg: #050508; 
            --x-color: #ff003c; 
            --o-color: #00f2ff; 
            --grid-color: #bc13fe; 
            --main-font: 'Cairo', sans-serif; 
        }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        body { 
            margin: 0; 
            font-family: var(--main-font); 
            background-color: var(--bg); 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .container { width: 100%; max-width: 360px; margin: auto; text-align: center; position: relative; }
        .screen { display: none; flex-direction: column; gap: 12px; animation: fadeIn 0.3s ease; padding: 15px; }
        .screen.active { display: flex; }
        
        .hero-title { font-size: clamp(4rem, 15vw, 6rem); font-weight: 900; margin-bottom: 5px; }
        .hero-x { color: var(--x-color); text-shadow: 0 0 20px var(--x-color); }
        .hero-o { color: var(--o-color); text-shadow: 0 0 20px var(--o-color); }
        
        button { 
            padding: 14px; font-size: 1rem; cursor: pointer; background: rgba(255, 255, 255, 0.04); 
            color: #fff; border: 2px solid var(--grid-color); border-radius: 14px; 
            transition: transform 0.2s; font-weight: 700; font-family: inherit; outline: none; 
        }
        button:active { transform: scale(0.95); }
        
        .board-container { position: relative; width: fit-content; margin: 15px auto; direction: ltr !important; }
        .board { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            width: min(300px, 80vw); height: min(300px, 80vw); 
            direction: ltr; filter: drop-shadow(0 0 8px var(--grid-color)); position: relative; 
        }

        .win-line {
            position: absolute; height: 5px; background: white; border-radius: 10px;
            box-shadow: 0 0 15px white, 0 0 30px var(--grid-color);
            z-index: 10; pointer-events: none; opacity: 0;
            transform-origin: left center;
            transform: scaleX(0); 
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
        }

        .cell { display: flex; justify-content: center; align-items: center; font-size: clamp(2rem, 10vw, 3rem); cursor: pointer; font-weight: 900; }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .cell.x { color: var(--x-color); text-shadow: 0 0 15px var(--x-color); animation: pop 0.2s ease; }
        .cell.o { color: var(--o-color); text-shadow: 0 0 15px var(--o-color); animation: pop 0.2s ease; }
        
        .cell:nth-child(1), .cell:nth-child(2), .cell:nth-child(4), .cell:nth-child(5), .cell:nth-child(7), .cell:nth-child(8) { border-right: 4px solid var(--grid-color); }
        .cell:nth-child(1), .cell:nth-child(2), .cell:nth-child(3), .cell:nth-child(4), .cell:nth-child(5), .cell:nth-child(6) { border-bottom: 4px solid var(--grid-color); }

        .status-area { font-size: 1.2rem; font-weight: 700; min-height: 50px; display: flex; align-items: center; justify-content: center; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .back-link { color: #666; font-size: 0.9rem; margin-top: 10px; cursor: pointer; border: none; background: none; font-family: inherit; }
        .footer-rights { font-size: 0.7rem; color: rgba(255,255,255,0.2); margin-top: 15px; }
        select { padding: 10px; background: #000; color: #fff; border: 1px solid var(--grid-color); border-radius: 8px; width: 100%; font-family: inherit; }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu" class="screen active">
        <div class="hero-title"><span class="hero-x">X</span><span class="hero-o">O</span></div>
        <button id="btn-start" onclick="showScreen('mode-selection')">ابدأ المواجهة</button>
        <button id="btn-settings" onclick="showScreen('settings-menu')">الإعدادات</button>
        <button id="btn-support" onclick="contactSupport()">الدعم الفني</button>
        <div class="footer-rights">© 2026 ZAID JO</div>
    </div>

    <div id="mode-selection" class="screen">
        <h2 id="title-mode">طور اللعب</h2>
        <button id="btn-vs-ai" onclick="showScreen('difficulty-menu')">ضد الذكاء الاصطناعي</button>
        <button id="btn-vs-friend" onclick="startGame(2, 'none')">تحدي صديق</button>
        <button id="btn-back-mode" class="back-link" onclick="showScreen('main-menu')">رجوع</button>
    </div>

    <div id="difficulty-menu" class="screen">
        <h2 id="title-diff">الخصم</h2>
        <button id="btn-easy" onclick="startGame(1, 'easy')">المبتدئ</button>
        <button id="btn-hard" onclick="startGame(1, 'hard')">Impossible AI</button>
        <button id="btn-back-diff" class="back-link" onclick="showScreen('mode-selection')">رجوع</button>
    </div>

    <div id="settings-menu" class="screen">
        <h2 id="title-settings">الإعدادات</h2>
        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; text-align: start;">
            <label id="lbl-lang">اللغة (Language):</label>
            <select id="lang-select" onchange="changeLang()">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>
        <button id="btn-save" onclick="showScreen('main-menu')">حفظ</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="status-area" id="game-status"></div>
        <div class="board-container">
            <div id="win-line" class="win-line"></div>
            <div class="board" id="board">
                <div class="cell" data-idx="0"></div><div class="cell" data-idx="1"></div><div class="cell" data-idx="2"></div>
                <div class="cell" data-idx="3"></div><div class="cell" data-idx="4"></div><div class="cell" data-idx="5"></div>
                <div class="cell" data-idx="6"></div><div class="cell" data-idx="7"></div><div class="cell" data-idx="8"></div>
            </div>
        </div>
        <button id="btn-reset" onclick="resetGame()">إعادة اللعب</button>
        <button id="btn-main-menu" class="back-link" onclick="showScreen('main-menu')">القائمة الرئيسية</button>
    </div>
</div>

<script type="text/javascript">
    const translations = {
        ar: { start: "ابدأ المواجهة", settings: "الإعدادات", support: "الدعم الفني", mode: "طور اللعب", vsAi: "ضد الذكاء الاصطناعي", vsFriend: "تحدي صديق", back: "رجوع", diff: "الخصم", easy: "المبتدئ", hard: "Impossible AI", lang: "اللغة (Language):", save: "حفظ", reset: "إعادة اللعب", mainMenu: "القائمة الرئيسية", supportMsg: "للتواصل والدعم: @Alzoubi_x0_support على تيليجرام" },
        en: { start: "START GAME", settings: "SETTINGS", support: "SUPPORT", mode: "GAME MODE", vsAi: "VS COMPUTER", vsFriend: "VS FRIEND", back: "BACK", diff: "DIFFICULTY", easy: "ROOKIE", hard: "IMPOSSIBLE AI", lang: "Language:", save: "SAVE", reset: "RESET GAME", mainMenu: "MAIN MENU", supportMsg: "Support: @Alzoubi_x0_support on Telegram" }
    };

    let boardState = Array(9).fill(""), currentPlayer = "X", gameActive = true, winner = null, gameMode = 1, aiDifficulty = 'hard', aiThinking = false;
    let curLang = 'ar';
    
    try {
        curLang = localStorage.getItem('zaid_xo_lang') || 'ar';
    } catch (e) {
        console.warn("Storage access denied, defaulting to 'ar'", e);
    }

    const allCells = document.querySelectorAll('.cell');

    function showScreen(id) {
        const screens = document.querySelectorAll('.screen');
        screens.forEach(s => s.classList.remove('active'));
        const target = document.getElementById(id);
        if (target) target.classList.add('active');
    }

    function updateUI() {
        try {
            const t = translations[curLang];
            document.body.dir = curLang === 'ar' ? 'rtl' : 'ltr';
            
            const safeUpdate = (id, text) => { const el = document.getElementById(id); if(el) el.innerText = text; };

            safeUpdate('btn-start', t.start);
            safeUpdate('btn-settings', t.settings);
            safeUpdate('btn-support', t.support);
            safeUpdate('title-mode', t.mode);
            safeUpdate('btn-vs-ai', t.vsAi);
            safeUpdate('btn-vs-friend', t.vsFriend);
            safeUpdate('title-diff', t.diff);
            safeUpdate('btn-easy', t.easy);
            safeUpdate('btn-hard', t.hard);
            safeUpdate('title-settings', t.settings);
            safeUpdate('lbl-lang', t.lang);
            safeUpdate('btn-save', t.save);
            safeUpdate('btn-reset', t.reset);
            safeUpdate('btn-main-menu', t.mainMenu);
            
            document.querySelectorAll('.back-link').forEach(el => el.innerText = t.back);
            document.getElementById('lang-select').value = curLang;
            updateStatus();
        } catch (e) { console.error("UI Update Error: ", e); }
    }

    function changeLang() {
        curLang = document.getElementById('lang-select').value;
        try {
            localStorage.setItem('zaid_xo_lang', curLang);
        } catch (e) {
            console.warn("Could not save language to storage", e);
        }
        updateUI();
    }

    function contactSupport() {
        alert(translations[curLang].supportMsg);
    }

    function startGame(m, d) {
        gameMode = m; if (d !== 'none') aiDifficulty = d;
        showScreen('game-screen');
        resetGame();
    }

    function handleCell(idx) {
        if (boardState[idx] !== "" || !gameActive || aiThinking) return;
        makeMove(idx);
        if (gameActive && gameMode === 1 && currentPlayer === "O") {
            aiThinking = true;
            setTimeout(() => { aiMove(); aiThinking = false; }, 600);
        }
    }

    function makeMove(idx) {
        boardState[idx] = currentPlayer;
        allCells[idx].innerText = currentPlayer;
        allCells[idx].classList.add(currentPlayer.toLowerCase());
        
        let winCombo = checkWin(boardState, currentPlayer);
        if (winCombo) { 
            winner = currentPlayer; gameActive = false; 
            drawWinLine(winCombo);
        }
        else if (!boardState.includes("")) { winner = 'draw'; gameActive = false; }
        else { currentPlayer = currentPlayer === "X" ? "O" : "X"; }
        updateStatus();
    }

    function drawWinLine(combo) {
        const line = document.getElementById('win-line');
        const board = document.getElementById('board');
        const firstCell = allCells[combo[0]];
        const lastCell = allCells[combo[2]];
        const boardRect = board.getBoundingClientRect();
        const firstRect = firstCell.getBoundingClientRect();
        const lastRect = lastCell.getBoundingClientRect();
        
        const x1 = firstRect.left + firstRect.width / 2 - boardRect.left;
        const y1 = firstRect.top + firstRect.height / 2 - boardRect.top;
        const x2 = lastRect.left + lastRect.width / 2 - boardRect.left;
        const y2 = lastRect.top + lastRect.height / 2 - boardRect.top;
        
        const length = Math.hypot(x2 - x1, y2 - y1);
        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        
        line.style.width = `${length}px`;
        line.style.left = `${x1}px`;
        line.style.top = `${y1}px`;
        line.style.transform = `rotate(${angle}deg) scaleX(1)`;
        line.style.opacity = '1';
    }

    function updateStatus() {
        const statusEl = document.getElementById('game-status');
        if (!gameActive) {
            if (winner === 'draw') statusEl.innerText = (curLang === 'ar' ? "تعادل!" : "Draw!");
            else statusEl.innerText = (curLang === 'ar' ? `الفائز ${winner} 🎉` : `${winner} Wins 🎉`);
        } else {
            statusEl.innerText = (curLang === 'ar' ? `دور ${currentPlayer}` : `${currentPlayer}'s Turn`);
        }
    }

    function aiMove() {
        let best;
        if (aiDifficulty === 'easy') {
            const avail = boardState.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            best = avail[Math.floor(Math.random() * avail.length)];
        } else {
            if (!boardState.some(c => c !== "")) best = 4;
            else best = getBestMove();
        }
        if (best !== undefined) makeMove(best);
    }

    function getBestMove() {
        let bestScore = -Infinity, move;
        for (let i = 0; i < 9; i++) {
            if (boardState[i] === "") {
                boardState[i] = "O"; 
                let score = minimax(boardState, 0, false); 
                boardState[i] = "";
                if (score > bestScore) { bestScore = score; move = i; }
            }
        }
        return move;
    }

    function minimax(s, depth, isMax) {
        if (checkWin(s, "O")) return 10 - depth;
        if (checkWin(s, "X")) return depth - 10;
        if (!s.includes("")) return 0;
        if (isMax) {
            let b = -Infinity;
            for(let i=0;i<9;i++) if(s[i]===""){ s[i]="O"; b=Math.max(b, minimax(s, depth+1, false)); s[i]=""; }
            return b;
        } else {
            let b = Infinity;
            for(let i=0;i<9;i++) if(s[i]===""){ s[i]="X"; b=Math.min(b, minimax(s, depth+1, true)); s[i]=""; }
            return b;
        }
    }

    function checkWin(s, p) {
        const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return w.find(c => c.every(idx => s[idx] === p)) || null;
    }

    function resetGame() {
        boardState.fill(""); currentPlayer = "X"; gameActive = true; winner = null; aiThinking = false;
        allCells.forEach(c => { c.innerText = ""; c.classList.remove('x', 'o'); });
        const line = document.getElementById('win-line');
        if(line) { line.style.opacity = '0'; line.style.transform = 'rotate(0deg) scaleX(0)'; }
        updateStatus();
    }

    allCells.forEach(c => {
        c.addEventListener('click', () => handleCell(parseInt(c.dataset.idx)));
    });

    updateUI();
</script>
</body>
</html>
